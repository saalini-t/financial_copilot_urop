# Configuration 2 -- RAG.
# query -> retrieval -> LLM -> recommendation -> evidence/citation explanation.

config_name: "rag"
description: >
  Configuration 2: retrieval-grounded recommendation with citation-based explanation.
  Still no deterministic tools, personalization, or constraint engine.

modules:
  use_rag: true
  use_tools: false
  use_personalization: false
  use_constraints: false
  use_candidate_catalogue: false

explanation_type: "citation_based"
prompt_version: "rag-v1"

retrieval:
  enabled: true
  top_k: 5
  index_version: "unversioned"

tool_config:
  enabled: false
